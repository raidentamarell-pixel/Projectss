<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title> Tugas Layap</title>
        
        <style>
            body {
                margin: 0;
                min-height: 100vh;

                display: flex;
                justify-content: center;
                align-items: center;

                background-image: url('space1.jpg');
                background-size: 100%;
                background-position: center 25%;
                background-repeat: no-repeat;
            }

            .login-box{
                width: 58vw;
                height: 72vh;
                
                display: flex;
                gap: 1rem;

                background-color: rgba(0, 0, 0, 0.9);

                border-radius: 2.1rem;
                padding: 0.65rem;
                box-sizing: border-box;
            }

            .login-image{
                width: 50%;
                border-radius: 1.5rem;
                overflow: hidden;
            }

            .login-image:hover{
                transform: scale(1.005);
            }

            .login-image img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            /*----------Form Kanan-----------*/

            .login-form {
                width: 50%;
                display: flex;
                flex-direction: column;
                justify-content: center;

                padding: 4rem;

                box-sizing: border-box;

                columns: white;
            }

            .login-form > h1 {
                margin: 0;
                text-align: center;
                font-size: 2.8rem;

                color: white;
            }

            .login-form p {
                text-align: center;
                margin-top: 0.7rem;
                margin-bottom: 2.5rem;
                font-size: 1.1rem;
                color: #aaa;
            }

            .login-form label {
                margin-bottom: 0.5rem;
                font-weight: bold;
                color: white;
            }

            .login-form input {
                width: 100%;
                padding: 1rem;
                margin-bottom: 1.5rem;

                box-sizing: border-box;

                border: none;
                border-radius: 0.4rem;

                background-color: rgba(20, 20, 20, 0.9);
                color: white;

                font-size: 0.95rem;
            }

            .login-form input:focus {
                outline: 2px solid #F7B000;
            }

            .login-form button {
                width: 100%;
                padding: 1rem;

                margin-top: 0.5rem;

                border: none;
                border-radius: 0.4;

                background-color: #F7B000;

                font-size: 1rem;
                font-weight: bold;

                cursor: pointer;

                border-radius: 0.4rem;
            }

            .login-form button:hover {
                background-color: #D19400;
                transform: scale(1.02);
            }

            .login-form button:active {
                background-color: #F7B000;
                transform: scale(1);
            }

            .register {
                margin-top: 1rem;
                text-align: center;
                color: white;
                font-size: 0.1rem;
            }

            .register b {
                color: #F7B000;
            }

            .login-form b:hover {
                cursor: pointer;
            }

        </style>
    </head>
    <body>
        <div class="login-box">
            <div class="login-image">
                <img src="ITS.jpg">
            </div>

            <div class="login-form">
                <h1>Login</h1>
                <p>
                    Masukkan Data Untuk Masuk Ke Akun
                </p>

                <label for="Email">
                    Email
                </label>

                <input
                    type="Email"
                    id="Email"
                    placeholder="Email"
                >

                <label for="Password"> 
                    Password
                </label>

                <input
                    type="password" 
                    id="Password"
                    placeholder="Password"
                >

                <button>
                    Login
                </button>

                <p class="register">
                    Belum ada member?
                    <b>Buat akun baru</b>
                </p>
            </div>
        </div>
    </body>
</html>
